version: '3.8'


services:
app:
build:
context: .
dockerfile: Dockerfile
volumes:
- ..:/workspaces/${localWorkspaceFolderBasename}:cached
command: bash -lc "sudo service apache2 start && sleep infinity"
network_mode: service:db
# Reuse db network namespace for simplicity so localhost:3306 works in app


db:
image: mysql:8.0
restart: unless-stopped
environment:
MYSQL_ROOT_PASSWORD: root
MYSQL_DATABASE: magento
MYSQL_USER: magento
MYSQL_PASSWORD: magento
ports:
- "3306:3306"
volumes:
- dbdata:/var/lib/mysql
healthcheck:
test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-pmagento"]
interval: 5s
timeout: 5s
retries: 20


search:
image: opensearchproject/opensearch:2.5.0
environment:
- discovery.type=single-node
- plugins.security.disabled=true
- bootstrap.memory_lock=true
- OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
ports:
- "9200:9200"
ulimits:
memlock:
soft: -1
hard: -1
healthcheck:
test: ["CMD", "curl", "-f", "http://localhost:9200/_cluster/health"]
interval: 10s
timeout: 5s
retries: 30


volumes:
dbdata:
